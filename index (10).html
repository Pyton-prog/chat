<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches de révision</title>
<style>
:root{
  --bg:#faf8f5; --surface:#ffffff; --text:#1f1d1a; --muted:#6f6a63; --border:#e4dfd7;
  --accent:#d9622b; --accent-text:#ffffff; --soft:#fbeadf; --danger:#b3341f;
  --good:#2f8f4e; --good-bg:#e1f3e7; --bad-bg:#fbe3df;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --surface:#211f1c; --text:#f2efe9; --muted:#9b958b; --border:#35322d;
    --accent:#ee8453; --accent-text:#1a1109; --soft:#3a2418; --danger:#ef7b66;
    --good:#5fcf83; --good-bg:#17301f; --bad-bg:#3a1b16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171614; --surface:#211f1c; --text:#f2efe9; --muted:#9b958b; --border:#35322d;
  --accent:#ee8453; --accent-text:#1a1109; --soft:#3a2418; --danger:#ef7b66;
  --good:#5fcf83; --good-bg:#17301f; --bad-bg:#3a1b16; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:22px;margin:4px 0 10px}
h2{font-size:17px;margin:18px 0 8px}
.auth-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}.auth-panel h2{margin:0 0 6px}.auth-panel .row{margin-top:10px}.auth-panel .msg{min-height:18px}.notice{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.hud{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:8px 12px;margin-bottom:12px;cursor:pointer}
.hud .info{flex:1;min-width:0}
.hud .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .ti{font-size:12px;color:var(--muted)}
.hud .coins{font-weight:700;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px 0;border-radius:10px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button span{font-size:17px;line-height:1}
.tabs button.on{background:var(--accent);color:var(--accent-text)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.card{perspective:1000px;margin:6px 0 12px}
.inner{position:relative;min-height:240px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.tag{position:absolute;top:12px;left:16px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.face .txt{font-size:20px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.hint{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.btn{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:12px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.sel{border-color:var(--accent);background:var(--soft)}
.btn:disabled{opacity:.5;cursor:default}
.count{color:var(--muted);font-size:13px;text-align:center;margin:10px 0 0}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
.item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.item .q{font-weight:600;white-space:pre-wrap;word-break:break-word}
.item .a{color:var(--muted);font-size:14px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.item .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.del{border:0;background:transparent;color:var(--danger);font:inherit;font-size:12px;cursor:pointer;padding:4px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.msg{font-size:13px;margin-top:8px;color:var(--muted);min-height:18px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
.qbox{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 18px;margin:8px 0 12px;text-align:center;font-size:19px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.qtop{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface);color:var(--text);padding:13px 14px;border-radius:14px;font:inherit;margin-bottom:8px;cursor:pointer;white-space:pre-wrap;word-break:break-word}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--danger);background:var(--bad-bg)}
.fb{margin:8px 0;font-weight:600}
.fb.good{color:var(--good)} .fb.bad{color:var(--danger)}
.hero{text-align:center}
.hero .stage{background:var(--soft);border-radius:18px;padding:10px 0 4px;margin-bottom:10px}
.stats{display:flex;justify-content:space-around;font-size:13px;color:var(--muted);margin-top:10px}
.stats b{display:block;font-size:17px;color:var(--text)}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cls{border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:16px;padding:8px 4px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.cls.sel{border-color:var(--accent);background:var(--soft)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shopi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;text-align:center}
.shopi .em{font-size:26px}
.shopi .nm{font-size:13px;font-weight:600}
.shopi .pr{font-size:12px;color:var(--muted);margin-bottom:6px}
.shopi .btn{padding:7px;font-size:13px;width:100%}
.leader-tabs{display:flex;gap:8px;margin-bottom:12px}
.leader-tabs .btn{padding:9px 7px;font-size:13px}
.leader-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.leader-row:last-child{border-bottom:0}
.leader-rank{font-size:18px;font-weight:800;text-align:center}
.leader-name{font-weight:700;overflow-wrap:anywhere}
.leader-sub{font-size:12px;color:var(--muted);margin-top:3px}
.leader-value{font-weight:800;text-align:right;white-space:nowrap}
.leader-empty{padding:20px;text-align:center;color:var(--muted)}
.lb{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;font-size:14px}
.lb.me{border-color:var(--accent);background:var(--soft)}
.lb .rk{width:22px;font-weight:700;color:var(--muted)}
.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .lv{font-size:12px;color:var(--muted)}
.btn.danger{color:var(--danger)}
.gi{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.gi input{width:20px;height:20px;padding:0;margin-top:2px;flex:none}
.gi .q{font-weight:600;font-size:14px}
.gi .w{font-size:12px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:12px;color:var(--muted);margin:0 0 8px}
.srow{display:flex;align-items:center;gap:8px;margin:10px 0}
.srow .lab{width:118px;font-size:14px;flex:none}
.srow .bar{flex:1;margin-top:0}
.srow .val{width:30px;text-align:right;font-weight:700}
.plus{width:32px;height:32px;border-radius:50%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);font-size:18px;font-weight:700;cursor:pointer;padding:0;line-height:1;flex:none}
.plus:disabled{opacity:.35;cursor:default;background:var(--surface);color:var(--muted);border-color:var(--border)}
.hp{height:12px;border-radius:99px;background:var(--border);overflow:hidden;margin:4px 0}
.hp>i{display:block;height:100%;border-radius:99px;transition:width .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}
.boss-panel{background:linear-gradient(160deg,#241540,#0d0a18);color:#f3eefc;border:2px solid #7c4dff;border-radius:20px;padding:16px;margin:8px 0 12px;box-shadow:0 0 22px rgba(124,77,255,.45)}
.orbs{display:flex;gap:8px;justify-content:center;margin:8px 0 6px}
.orb{width:16px;height:16px;border-radius:50%;background:#3a2d5e;border:2px solid #6b5aa8}
.orb.now{box-shadow:0 0 10px #ffd34d;border-color:#ffd34d}.orb.ok{background:#3ddc84;border-color:#3ddc84}.orb.ko{background:#ff5a5a;border-color:#ff5a5a}
.bq{font-size:18px;font-weight:700;text-align:center;margin:10px 0 14px;white-space:pre-wrap;word-break:break-word}
.runes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rune{display:flex;gap:8px;align-items:center;text-align:left;background:#2b1d4d;color:#f3eefc;border:1.5px solid #6b5aa8;border-radius:14px;padding:10px;font:inherit;font-size:14px;cursor:pointer;min-height:64px;word-break:break-word}
.rune b{flex:none;width:24px;height:24px;border-radius:50%;background:#6b5aa8;display:flex;align-items:center;justify-content:center;font-size:12px}
.rune.good{border-color:#3ddc84;background:#12402a}.rune.bad{border-color:#ff5a5a;background:#46181b}.rune:disabled{opacity:.55}.rune.good:disabled,.rune.bad:disabled{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Animations RPG ajoutées ---------- */
@keyframes cardEnter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes levelBurst{0%{transform:scale(.7);filter:brightness(1)}35%{transform:scale(1.08);filter:brightness(1.8)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes levelGlow{0%,100%{box-shadow:0 0 0 rgba(255,196,0,0)}50%{box-shadow:0 0 28px rgba(255,196,0,.8)}}
@keyframes bossEntrance{0%{opacity:0;transform:translateY(24px) scale(.88);filter:brightness(2)}65%{opacity:1;transform:translateY(-3px) scale(1.02)}100%{transform:translateY(0) scale(1);filter:brightness(1)}}
@keyframes monsterHit{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-9px) rotate(-4deg)}45%{transform:translateX(8px) rotate(4deg)}70%{transform:translateX(-4px) rotate(-2deg)}}
@keyframes heroLunge{0%{transform:translateX(0) scale(1)}40%{transform:translateX(20px) scale(1.08)}100%{transform:translateX(0) scale(1)}}
@keyframes rewardPop{0%{opacity:0;transform:translateY(12px) scale(.8)}60%{opacity:1;transform:translateY(-4px) scale(1.08)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes answerGood{0%{transform:scale(1)}40%{transform:scale(1.035);box-shadow:0 0 0 4px rgba(47,143,78,.15)}100%{transform:scale(1)}}
@keyframes answerBad{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.card{animation:cardEnter .28s ease-out both}
.boss-panel{animation:bossEntrance .65s cubic-bezier(.2,.8,.2,1) both}
.opt.good,.rune.good{animation:answerGood .45s ease-out}
.opt.bad,.rune.bad{animation:answerBad .32s ease-in-out}
.shopi{transition:transform .18s ease,box-shadow .18s ease}
.shopi:active{transform:scale(.98)}
.reward-pop{animation:rewardPop .55s cubic-bezier(.2,.8,.2,1) both}
.level-up{animation:levelBurst .8s ease-out,levelGlow .8s ease-out}
.hit-anim{animation:monsterHit .38s ease-in-out}
.hero-attack-anim{animation:heroLunge .38s ease-in-out}
@media(min-width:800px){
  .app{max-width:1000px;padding:24px 28px 60px}
  .tabs{flex-wrap:wrap;gap:6px}
  .tabs button{flex:1 1 110px;min-width:100px;flex-direction:row;justify-content:center;gap:7px;padding:10px 12px;font-size:13px;white-space:nowrap}
  .tabs button span{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<div class="app">
  <h1>📚 Fiches de révision</h1>
  <section id="auth-panel" class="auth-panel">
    <h2>Compte joueur</h2>
    <p class="count" style="text-align:left;margin:0">Connecte-toi pour sauvegarder ta progression en ligne.</p>
    <label for="auth-username">Nom d’utilisateur</label><input id="auth-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" placeholder="TonPseudo">
    <label for="auth-password">Mot de passe</label><input id="auth-password" type="password" autocomplete="current-password" placeholder="Au moins 8 caractères">
    <div class="row"><button id="auth-login" class="btn primary" type="button">Se connecter</button><button id="auth-signup" class="btn" type="button">Créer un compte</button></div>
    <div class="row"><button id="auth-logout" class="btn" type="button" hidden>Se déconnecter</button></div>
    <p class="count" style="text-align:left;margin:8px 0 0">Aucun e-mail demandé. Garde bien ton pseudo et ton mot de passe : sans e-mail, la récupération du mot de passe n’est pas possible.</p>
    <div id="auth-message" class="msg" role="status"></div>
  </section>
  <div id="notice" class="notice" hidden></div>
  <div id="hud" class="hud" hidden></div>

  <div class="tabs" role="tablist">
    <button id="t-courses" class="on" data-tab="courses"><span>📖</span>Cours</button>
    <button id="t-study" data-tab="study"><span>🃏</span>Réviser</button>
    <button id="t-quiz" data-tab="quiz"><span>⚔️</span>Quiz</button>
    <button id="t-inv" data-tab="inv"><span>🎒</span>Inventaire</button>
    <button id="t-shop" data-tab="shop"><span>🛒</span>Boutique</button>
    <button id="t-leaderboard" data-tab="leaderboard"><span>🏆</span>Classement</button>
    <button id="t-friends" data-tab="friends"><span>👥</span>Amis</button>
  </div>

  <div id="chips" class="chips"></div>

  <section id="courses"></section>
  <section id="study" hidden></section>
  <section id="quiz" hidden></section>
  <section id="hero" hidden></section>
  <section id="inv" hidden></section>
  <section id="shop" hidden></section>
  <section id="leaderboard" hidden></section>
  <section id="friends" hidden></section>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Bibliothèques côté navigateur pour extraire le texte des PDF et DOCX ; aucun compte ou service d’IA n’est utilisé. -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" defer></script>
<script>
(function(){
  // Diagnostic temporaire : affiche les erreurs JavaScript directement dans le panneau de compte.
  window.addEventListener('error', function(e){ var n=document.getElementById('auth-message'); if(n) n.textContent='Erreur JavaScript : '+(e.message||'inconnue')+' (ligne '+(e.lineno||'?')+')'; });
  window.addEventListener('unhandledrejection', function(e){ var n=document.getElementById('auth-message'); if(n) n.textContent='Erreur : '+(e.reason && e.reason.message ? e.reason.message : String(e.reason||'inconnue')); });
  /* ---------- données ---------- */
  var CLASSES = {
    chevalier:{label:'Chevalier', titles:['Écuyer','Chevalier','Paladin','Chevalier légendaire']},
    ninja:{label:'Ninja', titles:['Genin','Chūnin','Jōnin','Maître de l’ombre']},
    magicien:{label:'Magicien', titles:['Apprenti','Sorcier','Archimage','Grand mage']},
    lambda:{label:'Homme lambda', titles:['Monsieur Tout-le-monde','Bosseur','Cerveau','Légende urbaine']}
  };
  var SHOP = [
    {id:'shades', name:'Lunettes de soleil', price:25, em:'😎'},
    {id:'aura', name:'Aura dorée', price:30, em:'✨'},
    {id:'cape', name:'Cape rouge', price:40, em:'🦸'},
    {id:'crown', name:'Couronne', price:80, em:'👑'},
    {id:'wings', name:'Ailes', price:120, em:'🪽'}
  ];

  var STATS = [
    {k:'atk', label:'Attaque', em:'⚔️', base:25, per:3},
    {k:'def', label:'Défense', em:'🛡️', base:5, per:3},
    {k:'hp', label:'PV', em:'❤️', base:100, per:10},
    {k:'weight', label:'Poids', em:'⚖️', base:5, per:5, vsuf:' pl.'},
    {k:'speed', label:'Vitesse', em:'💨', base:10, per:3},
    {k:'agi', label:'Agilité', em:'🤸', base:5, per:1, u:'%'}
  ];
  var GEAR_SLOTS = [
    {k:'helmet', label:'Casque', em:'⛑️'}, {k:'armor', label:'Armure', em:'🦺'}, {k:'gloves', label:'Gants', em:'🧤'},
    {k:'weapon', label:'Arme principale', em:'🗡️'}, {k:'legs', label:'Jambes', em:'👖'}, {k:'shoes', label:'Souliers', em:'👟'}
  ];
  var GEAR_ITEMS = {};  // catalogue d’équipements : id -> {name, em, slot} (à remplir)
  var gearSel = null;
  function readGear(o){
    var r = {};
    GEAR_SLOTS.forEach(function(sl){ r[sl.k] = (o && typeof o[sl.k] === 'string') ? o[sl.k].slice(0, 60) : null; });
    return r;
  }
  var RESPEC_PRICE = 60, MAXLV = 150, MAXSTAT = 25;
  var POTIONS = [
    {id:'simple', name:'Potion simple', em:'🧪', pct:25, price:20},
    {id:'premium', name:'Potion premium', em:'⚗️', pct:50, price:75},
    {id:'parfaite', name:'Potion parfaite', em:'💖', pct:75, price:220}
  ];
  function emptyPotions(){ return {simple:0, premium:0, parfaite:0}; }
  function readPotions(a){
    var r = emptyPotions();
    if(a && typeof a === 'object') POTIONS.forEach(function(po){ r[po.id] = Math.max(0, Math.floor(+a[po.id] || 0)); });
    return r;
  }
  function readSeen(o){
    var r = {};
    if(o && typeof o === 'object') Object.keys(o).slice(0, 3000).forEach(function(k){ var n = Math.floor(+o[k] || 0); if(n > 0) r[k] = Math.min(n, 1000); });
    return r;
  }
  function rewardMult(id){
    var n = (me && me.seen && me.seen[id]) || 0;
    return n === 0 ? 1 : (n === 1 ? 0.4 : 0.05);
  }
  function emptyAlloc(){ return {atk:0, def:0, hp:0, weight:0, speed:0, agi:0}; }
  function readAlloc(a){
    var r = emptyAlloc();
    if(a && typeof a === 'object') STATS.forEach(function(st){ r[st.k] = Math.min(MAXSTAT, Math.max(0, Math.floor(+a[st.k] || 0))); });
    return r;
  }
  var cards = [];
  var db = null, myId = null, canWrite = true, canSave = true, loaded = false;
  var me = null, saving = false, dirty = false;
  var courses = [], themeFolders = [], themeView = null, fight = null, quizSeg = 'quiz', coursesMode = 'courses', exp = null, courseView = null, qFormOpen = false, quizCourse = '';

  /* ---------- profil / sauvegarde ---------- */
  function touch(){ dirty = true; save(); }
  function save(){
    // Ne jamais écrire tant que la base, l'identité du compte et le héros ne sont pas prêts.
    // On garde dirty=true si l'enregistrement n'est pas possible afin de ne pas perdre
    // silencieusement une modification en attente.
    if(!me) return;
    if(!db || !myId || !canSave){ dirty = true; return; }
    if(saving){ dirty = true; return; }

    var playerId = String(myId);
    var body = {
      ownerId: playerId,
      name: me.name, cls: me.cls, xp: me.xp, coins: me.coins,
      owned: me.owned, eq: me.eq, answered: me.answered, correct: me.correct,
      renames: me.renames || 0, gear: me.gear || readGear(null), camp: me.camp || 0,
      seen: me.seen || {}, alloc: me.alloc || emptyAlloc(), respec: me.respec || 0,
      potions: me.potions || emptyPotions(), classProgress: me.classProgress || {},
      updatedAt: Date.now()
    };

    saving = true;
    dirty = false;
    db.doc('players/' + playerId).set(body).then(function(){
      saving = false;
      syncLeaderboardProfile();
      // Si le joueur a modifié son héros pendant l'écriture, sauvegarder la version récente.
      if(dirty) save();
    }).catch(function(err){
      saving = false;
      dirty = true;
      var code = err && err.code ? String(err.code) : '';
      if(code.indexOf('permission') >= 0 || code.indexOf('unauthenticated') >= 0 || code.indexOf('unauthorized') >= 0){
        canSave = false;
        showNotice('Sauvegarde refusée par les autorisations de la base de données. Vérifie les droits d’écriture du joueur.');
      } else {
        showNotice('Échec de la sauvegarde en ligne. Ta progression est conservée en mémoire pour cette session ; réessaie dans un instant.');
      }
    });
  }

    }

    if(subs.every(function(x){return x.value!==studySubject;}))studySubject='Toutes';
    addSelect('Matière',subs,studySubject,function(v){studySubject=v;studyTheme='all';studyCourseId='all';reviewSession=null;render();});
    var themes=[{value:'all',label:'Tous les thèmes'}];

    if(themes.every(function(x){return x.value!==studyTheme;}))studyTheme='all';
    addSelect('Thème (facultatif)',themes,studyTheme,function(v){studyTheme=v;studyCourseId='all';reviewSession=null;render();});

  /* ---------- matières et thèmes des cours ---------- */
  function defaultTheme(subjectName, title, content){
    var s=String(subjectName||'').toLowerCase(), t=String(title||'').toLowerCase(), c=String(content||'').toLowerCase(), all=t+' '+c;
    if(s.indexOf('anglais')>=0) return 'Vocabulaire';
    if(s.indexOf('chimie')>=0) return /organi|sn1|sn2|e2|e1|carbonyl|alcool|ester|ald[eé]hyde|c[eé]tone|nucl[eé]ophile|magn[eé]sien|groupe partant|protection/.test(all) ? 'Chimie organique' : 'Chimie générale';
    if(s.indexOf('physique')>=0){
      if(/thermo|enthalpie|entropie|calorim|gaz parfait/.test(all)) return 'Thermodynamique';
      if(/[eé]lectric|circuit|condensateur|maxwell|magn[eé]t|courant|tension/.test(all)) return 'Électricité';
      return 'Mécanique';
    }
    return 'Général';
  }
  function normalizeCourseTheme(c){ if(!c.theme) c.theme=defaultTheme(c.subject,c.title,c.content); return c; }
  function fixedThemesForSubject(s){
    var n=String(s||'').toLowerCase();
    if(n.indexOf('anglais')>=0) return ['Vocabulaire'];
    if(n==='chimie') return ['Chimie organique','Chimie générale'];
    if(n==='physique') return ['Mécanique','Électricité','Thermodynamique'];
    return [];
  }
  function allCourseSubjects(){
    var out=['Anglais','Chimie','Physique','Maths'];
    courses.forEach(function(c){if(c.subject&&c.subject.toLowerCase()!=='général'&&c.subject.toLowerCase()!=='general'&&out.indexOf(c.subject)<0)out.push(c.subject);});
    themeFolders.forEach(function(t){if(t.subject&&t.subject.toLowerCase()!=='général'&&t.subject.toLowerCase()!=='general'&&out.indexOf(t.subject)<0)out.push(t.subject);});
    return out.sort(function(a,b){return a.localeCompare(b);});
  }
  function themesForSubject(s){
    var fixed=fixedThemesForSubject(s), out=fixed.slice();
    themeFolders.forEach(function(t){if(t.subject===s&&t.theme&&out.indexOf(t.theme)<0)out.push(t.theme);});
    courses.forEach(function(c){if(c.subject===s&&c.theme&&out.indexOf(c.theme)<0)out.push(c.theme);});
    return out.sort(function(a,b){var ia=fixed.indexOf(a),ib=fixed.indexOf(b);if(ia>=0||ib>=0){if(ia<0)return 1;if(ib<0)return -1;return ia-ib;}return a.localeCompare(b);});
  }
  function addThemeFolder(subjectName, themeName){
    var exists=themesForSubject(subjectName).some(function(t){return t.toLowerCase()===themeName.toLowerCase();});
    if(exists)return Promise.resolve(false);
    var record={isThemeFolder:true,title:'',subject:subjectName,theme:themeName,content:'',image:'',createdAt:Date.now(),author:myId||''};
    if(db&&canWrite)return db.collection('courses').add(record).then(function(){return true;});
    themeFolders.push({id:uid(),subject:subjectName,theme:themeName,createdAt:record.createdAt});
    return Promise.resolve(true);

  function promptCreateTheme(subjectName,onCreated){

  function readCourseFile(file){
    return new Promise(function(resolve,reject){
      if(!file) return reject(new Error('Choisis un fichier.'));
      if(file.size > 15*1024*1024) return reject(new Error('Fichier trop volumineux : limite de 15 Mo.'));
      var name=String(file.name||'').toLowerCase(), reader=new FileReader();
      reader.onerror=function(){reject(new Error('Impossible de lire ce fichier.'));};
      if(name.endsWith('.txt') || file.type==='text/plain'){
        reader.onload=function(){resolve(String(reader.result||''));}; reader.readAsText(file); return;
      }
      if(name.endsWith('.docx') || file.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document'){
        reader.onload=function(){
          if(!window.mammoth) return reject(new Error('Le lecteur DOCX ne s’est pas chargé. Vérifie la connexion internet puis réessaie.'));
          window.mammoth.extractRawText({arrayBuffer:reader.result}).then(function(r){resolve(String(r.value||''));}).catch(function(){reject(new Error('Ce fichier DOCX est illisible ou endommagé.'));});
        }; reader.readAsArrayBuffer(file); return;
      }
      if(name.endsWith('.pdf') || file.type==='application/pdf'){
        reader.onload=function(){
          if(!window.pdfjsLib) return reject(new Error('Le lecteur PDF ne s’est pas chargé. Vérifie la connexion internet puis réessaie.'));
          try{
            window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
            window.pdfjsLib.getDocument({data:new Uint8Array(reader.result)}).promise.then(function(pdf){
              var pages=[], chain=Promise.resolve();
              for(var i=1;i<=pdf.numPages;i++)(function(pageNo){chain=chain.then(function(){return pdf.getPage(pageNo).then(function(page){return page.getTextContent().then(function(tc){pages.push(tc.items.map(function(it){return it.str||'';}).join(' '));});});});})(i);
              chain.then(function(){resolve(pages.join('\n\n'));}).catch(function(){reject(new Error('Impossible d’extraire le texte de ce PDF.'));});
            }).catch(function(){reject(new Error('Ce PDF est illisible, protégé ou endommagé.'));});
          }catch(e){reject(new Error('Impossible d’ouvrir ce PDF.'));}
        }; reader.readAsArrayBuffer(file); return;
      }
      reject(new Error('Format non pris en charge. Choisis un fichier PDF, TXT ou DOCX.'));
    }).then(function(text){
      text=String(text||'').replace(/\u0000/g,'').replace(/[ \t]+\n/g,'\n').trim();
      if(!text) throw new Error('Aucun texte n’a été trouvé. Si le PDF est un scan, il faut une reconnaissance OCR, non incluse ici.');
      if(text.length>20000) text=text.slice(0,20000);
      return text;
    });
  }

  /* ---------- export / import de cours ---------- */
  function encodeCourse(c){
    var qs = cards.filter(function(x){ return x.courseId === c.id; }).map(function(x){ return { q:x.q, a:x.a, wrong:x.wrong || [] }; });
    var json = JSON.stringify({ v:1, c:{ title:c.title, subject:c.subject, theme:c.theme || defaultTheme(c.subject,c.title,c.content), content:c.content, image:c.image || '' }, qs:qs });
    return 'FICHE1:' + btoa(unescape(encodeURIComponent(json)));
  }
  function decodeCourse(code){
    code = String(code).trim().replace(/\s+/g,'');
    if(code.indexOf('FICHE1:') !== 0) throw new Error('format');
    var o = JSON.parse(decodeURIComponent(escape(atob(code.slice(7)))));
    if(!o || o.v !== 1 || !o.c) throw new Error('format');
    var title = String(o.c.title || '').trim().slice(0,80), content = String(o.c.content || '').trim().slice(0,20000);
    if(!title || !content) throw new Error('format');
    var qs = (Array.isArray(o.qs) ? o.qs : []).slice(0,200).map(function(x){
      if(!x) return null;
      var q = String(x.q || '').trim().slice(0,600), a = String(x.a || '').trim().slice(0,300);
      if(!q || !a) return null;
      var w = (Array.isArray(x.wrong) ? x.wrong : []).map(function(y){ return String(y).trim().slice(0,300); }).filter(Boolean).slice(0,3);
      return { q:q, a:a, wrong:w };
    }).filter(Boolean);
    return { title:title, subject:String(o.c.subject || 'Général').trim().slice(0,40) || 'Général', theme:String(o.c.theme || '').trim().slice(0,60), content:content, image:String(o.c.image || ''), qs:qs };
  }
  function copyText(text, ta){
    var ok = false;
    try{ ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); }catch(e){}
    if(ok){ toast('Code copié !'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('Code copié !'); }, function(){ toast('Sélectionne le code et copie-le à la main.'); });
    } else toast('Sélectionne le code et copie-le à la main.');
  }

    {t:'Chimie orga : oxydoréduction', s:'Chimie', c:'Oxydation des alcools : alcool primaire → aldéhyde (oxydation ménagée : PCC, Swern) → acide carboxylique (oxydants forts : KMnO4, Jones CrO3/H2SO4). Alcool secondaire → cétone. Alcool tertiaire : pas d’oxydation (aucun H sur le carbone portant OH).\nRéduction des carbonyles : NaBH4 (dans l’éthanol) réduit aldéhydes et cétones en alcools, sans toucher aux esters. LiAlH4 (éther anhydre, puis hydrolyse) réduit aussi esters, acides carboxyliques et amides.\nHydrogénation catalytique : H2 avec Pd/C réduit C=C en C–C.',
     q:[['Produit de l’oxydation d’un alcool secondaire ?','Une cétone','Un aldéhyde','Un acide carboxylique','Un alcène'],
        ['Pourquoi un alcool tertiaire n’est-il pas oxydé par les oxydants usuels ?','Il n’a pas d’hydrogène sur le carbone portant OH','Il est trop encombré pour être attaqué','Il est déjà oxydé','Il réagit seulement en milieu basique'],
        ['Quel réducteur réduit aldéhydes et cétones mais pas les esters ?','NaBH4','LiAlH4','KMnO4','CrO3'],
        ['Produit de l’oxydation poussée d’un alcool primaire (KMnO4, Jones) ?','Un acide carboxylique','Un aldéhyde','Une cétone','Un ester']]},
    {t:'Chimie orga : addition magnésienne', s:'Chimie', c:'Organomagnésien RMgX : préparé par R–X + Mg dans l’éther anhydre (éther diéthylique ou THF). Le carbone lié à Mg est nucléophile et très basique.\nMilieu rigoureusement anhydre et sans H acide (eau, alcool, acide), sinon RMgX est détruit en R–H.\nAddition sur un carbonyle puis hydrolyse acide : méthanal → alcool primaire ; autre aldéhyde → alcool secondaire ; cétone → alcool tertiaire.\nSur un ester : double addition, alcool tertiaire (deux groupes R identiques). Sur CO2 : acide carboxylique.',
     q:[['Solvant utilisé pour préparer un organomagnésien ?','Un éther anhydre','L’eau','L’éthanol','L’acide acétique'],
        ['Produit de l’addition d’un magnésien sur une cétone, puis hydrolyse ?','Un alcool tertiaire','Un alcool secondaire','Un alcool primaire','Un aldéhyde'],
        ['Pourquoi travailler en milieu anhydre ?','Le magnésien est une base forte qui réagit avec l’eau pour donner R–H','L’eau oxyde le magnésium','L’eau réduit le carbonyle','L’eau est trop polaire pour l’éther'],
        ['Addition d’un magnésien sur CO2 puis hydrolyse ?','Un acide carboxylique','Un alcool','Un aldéhyde','Un ester']]},
    {t:'Chimie orga : substitutions nucléophiles (SN)', s:'Chimie', c:'Substitution : R–GP + Nu⁻ → R–Nu + GP⁻.\nSN2 : une étape concertée, v = k[RX][Nu], attaque dorsale, inversion de Walden. Favorisée par un carbone primaire peu encombré, un bon nucléophile et un solvant polaire aprotique (DMF, DMSO, acétone).\nSN1 : deux étapes, carbocation intermédiaire (étape lente), v = k[RX], racémisation. Favorisée par un carbone tertiaire ou stabilisé (allylique, benzylique), un solvant polaire protique (eau, alcools) et un bon groupe partant.\nCarbone secondaire : les deux mécanismes sont possibles selon les conditions.\nPas de substitution sur un carbone sp² (halogénure vinylique ou aryle) dans les conditions usuelles.',
     q:[['Loi de vitesse d’une SN1 ?','v = k[RX]','v = k[RX][Nu]','v = k[Nu]','v = k[RX]²'],
        ['Quel solvant favorise la SN2 ?','Polaire aprotique (DMSO, DMF)','Polaire protique (eau)','Apolaire (hexane)','Aucun solvant'],
        ['Conséquence stéréochimique d’une SN1 sur un carbone asymétrique ?','Racémisation','Inversion totale','Rétention totale','Aucune réaction'],
        ['Sur quel carbone la SN1 est-elle favorisée ?','Tertiaire','Primaire','Méthyle','Vinylique']]},
    {t:'Chimie orga : élimination', s:'Chimie', c:'Élimination : β-élimination de H–GP qui forme une liaison C=C.\nE2 : une étape concertée, base forte (HO⁻, RO⁻, tBuOK), H en anti-périplanaire du groupe partant, v = k[RX][B].\nE1 : deux étapes via un carbocation (en concurrence avec SN1), v = k[RX], favorisée à chaud en milieu polaire protique.\nRègle de Zaïtsev : l’alcène majoritaire est le plus substitué (le plus stable). Une base volumineuse (tBuOK) donne l’alcène de Hofmann (le moins substitué).\nSubstitution ou élimination : chauffer avec une base forte, surtout encombrée, favorise l’élimination ; un bon nucléophile peu basique favorise la substitution.',
     q:[['Que dit la règle de Zaïtsev ?','L’alcène majoritaire est le plus substitué','L’alcène majoritaire est le moins substitué','Le produit est toujours un alcool','Le produit est toujours un alcane'],
        ['Loi de vitesse d’une E2 ?','v = k[RX][Base]','v = k[RX]','v = k[Base]','v = k[RX]²'],
        ['Quelle base favorise l’alcène de Hofmann ?','Une base volumineuse (tBuOK)','HO⁻ en solution aqueuse','Un nucléophile faible','Un acide fort'],
        ['Quelle condition favorise l’élimination par rapport à la substitution ?','Chauffer avec une base forte','Travailler à froid avec un nucléophile peu basique','Ajouter de l’eau','Ajouter un acide']]},
    {t:'Chimie orga : protection d’une cétone', s:'Chimie', c:'But : rendre une fonction inerte pendant une réaction qui doit avoir lieu ailleurs dans la molécule (par exemple réduire un ester par LiAlH4 ou former un magnésien en présence d’une cétone).\nProtection d’un carbonyle : acétalisation avec un diol (éthane-1,2-diol) en catalyse acide (APTS), en éliminant l’eau (Dean-Stark). On obtient un acétal cyclique (dioxolane).\nL’acétal est stable en milieu basique et nucléophile (RMgX, LiAlH4, NaOH) mais s’hydrolyse en milieu acide aqueux (déprotection).\nUn bon groupe protecteur s’introduit et se retire avec de bons rendements, sélectivement, et résiste aux conditions de la réaction visée.',
     q:[['Comment protéger une cétone ?','Avec un diol (éthane-1,2-diol) en catalyse acide','Avec un acide carboxylique en milieu basique','Avec LiAlH4','Avec un magnésien'],
        ['Quel composé obtient-on par protection ?','Un acétal cyclique','Un ester','Un alcool','Un alcène'],
        ['Dans quel milieu l’acétal est-il stable ?','Basique et nucléophile','Acide aqueux','Acide concentré et chaud','Dans aucun milieu'],
        ['Comment déprotéger l’acétal ?','Par hydrolyse en milieu acide aqueux','Par chauffage en milieu basique','Par ajout de LiAlH4','Par ajout de RMgX']]},
    {t:'Chimie orga : groupes partants', s:'Chimie', c:'Groupe partant (GP) : fragment qui part avec le doublet de la liaison C–GP. Un bon GP est une base faible (base conjuguée d’un acide fort) et stable en solution.\nHalogénures : I⁻ > Br⁻ > Cl⁻ >> F⁻.\nExcellents GP : sulfonates (tosylate TsO⁻, mésylate MsO⁻, triflate TfO⁻), I⁻, Br⁻.\nMauvais GP : HO⁻, RO⁻, NH2⁻ (bases fortes).\nTransformer un alcool en bon électrophile : le protoner en milieu acide (GP = H2O) ou le convertir en tosylate (TsCl, pyridine).\nUn meilleur GP accélère SN1, SN2, E1 et E2.',
     q:[['Ordre des halogénures comme groupes partants ?','I⁻ > Br⁻ > Cl⁻ > F⁻','F⁻ > Cl⁻ > Br⁻ > I⁻','Cl⁻ > Br⁻ > I⁻ > F⁻','Ils sont tous équivalents'],
        ['Qu’est-ce qui caractérise un bon groupe partant ?','C’est une base faible, stable en solution','C’est une base forte','C’est un acide faible','C’est un cation très instable'],
        ['Comment transformer OH en bon groupe partant ?','Le protoner (H2O) ou former un tosylate (TsCl)','Le déprotoner avec une base forte','Le réduire avec LiAlH4','L’oxyder en cétone'],
        ['Lequel est un excellent groupe partant ?','Le tosylate TsO⁻','HO⁻','NH2⁻','H⁻']]},
    {t:'Développements limités usuels (PCSI)', s:'Maths', c:'Au voisinage de 0 :\ne^x = 1 + x + x²/2 + x³/6 + o(x³)\nsin x = x − x³/6 + o(x⁴) ; cos x = 1 − x²/2 + x⁴/24 + o(x⁵)\nln(1+x) = x − x²/2 + x³/3 + o(x³)\n1/(1−x) = 1 + x + x² + x³ + o(x³)\n(1+x)^α = 1 + αx + α(α−1)/2 x² + o(x²)',
     q:[['DL de e^x à l’ordre 2 en 0 ?','1 + x + x²/2 + o(x²)','1 + x + x² + o(x²)','1 + x/2 + x²/6 + o(x²)','x + x²/2 + o(x²)'],
        ['DL de sin x à l’ordre 3 en 0 ?','x − x³/6 + o(x³)','x − x³/3 + o(x³)','x + x³/6 + o(x³)','1 − x²/2 + o(x³)'],
        ['DL de ln(1+x) à l’ordre 2 en 0 ?','x − x²/2 + o(x²)','x + x²/2 + o(x²)','x − x² + o(x²)','1 + x − x²/2 + o(x²)'],
        ['DL de 1/(1−x) en 0 ?','1 + x + x² + … + xⁿ + o(xⁿ)','1 − x + x² − … + o(xⁿ)','1 + x/2 + x²/3 + …','1 + x + x²/2 + … + o(xⁿ)']]},
    {t:'Suites réelles (PCSI)', s:'Maths', c:'Suite arithmétique : u_n = u_0 + n r. Suite géométrique : u_n = u_0 q^n ; somme de k = 0 à n : u_0 (1 − q^(n+1)) / (1 − q) si q ≠ 1.\nThéorème de convergence monotone : toute suite croissante et majorée converge (décroissante et minorée aussi).\nThéorème des gendarmes : si u_n ≤ v_n ≤ w_n et u_n, w_n → ℓ, alors v_n → ℓ.\nSuites adjacentes : (u_n) croissante, (v_n) décroissante, v_n − u_n → 0 : elles convergent vers la même limite.\nSuite géométrique : converge vers 0 si |q| < 1 ; diverge si |q| > 1 ou q = −1.',
     q:[['Somme des q^k pour k de 0 à n (q ≠ 1) ?','(1 − q^(n+1)) / (1 − q)','(1 − q^n) / (1 − q)','(q^(n+1) − 1) / (1 + q)','(1 − q^(n+1)) / (1 + q)'],
        ['Théorème de convergence monotone ?','Toute suite croissante et majorée converge','Toute suite croissante converge','Toute suite bornée converge','Toute suite majorée converge'],
        ['Si u_n ≤ v_n ≤ w_n et u_n, w_n → ℓ, que dire de v_n ?','v_n → ℓ','v_n diverge','v_n → 0','On ne peut pas conclure'],
        ['Que devient une suite géométrique de raison q avec |q| < 1 ?','Elle converge vers 0','Elle diverge','Elle converge vers 1','Elle converge vers q']]},
    {t:'Continuité (PCSI)', s:'Maths', c:'f est continue en a si lim f(x) quand x → a vaut f(a).\nThéorème des valeurs intermédiaires (TVI) : l’image d’un intervalle par une fonction continue est un intervalle ; si f est continue sur [a, b] et f(a) f(b) < 0, f s’annule sur ]a, b[.\nThéorème des bornes atteintes : une fonction continue sur un segment [a, b] est bornée et atteint ses bornes.\nThéorème de la bijection : f continue et strictement monotone sur un intervalle I réalise une bijection de I sur f(I), de réciproque continue et de même monotonie.',
     q:[['f continue sur [a, b] avec f(a) f(b) < 0 : que dit le TVI ?','f s’annule au moins une fois sur ]a, b[','f s’annule exactement une fois','f est strictement monotone','f est dérivable'],
        ['Théorème des bornes atteintes ?','Une fonction continue sur un segment est bornée et atteint ses bornes','Toute fonction continue est bornée','Une fonction continue sur un intervalle ouvert est bornée','Toute fonction bornée est continue'],
        ['Condition pour une bijection d’un intervalle I sur f(I) ?','f continue et strictement monotone','f continue seulement','f dérivable seulement','f bornée et croissante'],
        ['Définition de la continuité de f en a ?','lim f(x) quand x → a est égale à f(a)','f est définie en a','lim f(x) quand x → a existe','f est dérivable en a']]},
    {t:'Dérivation (PCSI)', s:'Maths', c:'Dérivées usuelles : (x^n)′ = n x^(n−1) ; (e^x)′ = e^x ; (ln x)′ = 1/x ; (sin)′ = cos ; (cos)′ = −sin ; (tan)′ = 1 + tan² = 1/cos².\n(uv)′ = u′v + u v′ ; (u/v)′ = (u′v − u v′) / v² ; (g∘f)′ = f′ × (g′∘f).\nThéorème de Rolle : f continue sur [a, b], dérivable sur ]a, b[, avec f(a) = f(b) ⇒ il existe c dans ]a, b[ tel que f′(c) = 0.\nThéorème des accroissements finis (TAF) : il existe c dans ]a, b[ tel que f(b) − f(a) = f′(c)(b − a).\nInégalité des accroissements finis : si |f′| ≤ M, alors |f(b) − f(a)| ≤ M |b − a|.',
     q:[['Dérivée de ln x sur ]0, +∞[ ?','1/x','ln x / x','−1/x','e^x'],
        ['Dérivée du quotient u/v ?','(u′v − u v′) / v²','(u′v + u v′) / v²','u′ / v′','(u v′ − u′v) / v²'],
        ['Que dit le théorème de Rolle ?','Si f(a) = f(b), f′ s’annule en un point de ]a, b[','Si f′(a) = f′(b), f s’annule','Si f(a) = 0, alors f′(a) = 0','Si f est croissante, f′ s’annule'],
        ['Que dit le TAF ?','Il existe c dans ]a, b[ tel que f(b) − f(a) = f′(c)(b − a)','f(b) − f(a) = f′(a)(b − a)','f(b) − f(a) = f′(b)','f(b) + f(a) = f′(c)(b − a)']]},
    {t:'Intégration (PCSI)', s:'Maths', c:'Primitives usuelles : ∫ x^n dx = x^(n+1)/(n+1) (n ≠ −1) ; ∫ dx/x = ln|x| ; ∫ e^x dx = e^x ; ∫ cos = sin ; ∫ sin = −cos ; ∫ dx/(1+x²) = arctan x.\nIntégration par parties : ∫ u v′ = [u v] − ∫ u′ v.\nChangement de variable x = φ(t) : ∫ f(x) dx = ∫ f(φ(t)) φ′(t) dt.\nThéorème fondamental : si f est continue, x ↦ ∫ de a à x de f(t) dt est la primitive de f qui s’annule en a.\nInégalité triangulaire : |∫ f| ≤ ∫ |f|. Valeur moyenne de f sur [a, b] : (1/(b − a)) ∫ de a à b de f.',
     q:[['Primitive de 1/(1 + x²) ?','arctan x','ln(1 + x²)','arcsin x','1/(1 + x²)'],
        ['Formule d’intégration par parties ?','∫ u v′ = [u v] − ∫ u′ v','∫ u v′ = [u v] + ∫ u′ v','∫ u v′ = u′ v − u v′','∫ u v′ = ∫ u × ∫ v′'],
        ['Primitive de 1/x sur ]0, +∞[ ?','ln x','1/x²','−1/x²','e^x'],
        ['Valeur moyenne de f sur [a, b] ?','(1/(b − a)) ∫ de a à b de f','∫ de a à b de f','(b − a) ∫ de a à b de f','(f(a) + f(b)) / 2']]},
    {t:'Équations différentielles linéaires (PCSI)', s:'Maths', c:'Ordre 1 : y′ + a(x) y = b(x). Solution générale = solution générale de l’équation homogène + une solution particulière. Homogène : y = λ e^(−A(x)) où A est une primitive de a.\nOrdre 2 à coefficients constants : a y″ + b y′ + c y = 0, équation caractéristique a r² + b r + c = 0.\nΔ > 0 : y = λ e^(r1 x) + μ e^(r2 x). Δ = 0 : y = (λ + μ x) e^(r x). Δ < 0 (r = α ± iβ) : y = e^(α x) (λ cos βx + μ sin βx).\nProblème de Cauchy : une condition initiale (ordre 1) ou deux (ordre 2) donnent une solution unique.',
     q:[['Solutions de y′ + a(x) y = 0 ?','y = λ e^(−A(x)) avec A primitive de a','y = λ e^(A(x))','y = λ A(x)','y = λ + A(x)'],
        ['Δ < 0 avec r = α ± iβ : forme des solutions de a y″ + b y′ + c y = 0 ?','y = e^(α x) (λ cos βx + μ sin βx)','y = λ e^(α x) + μ e^(β x)','y = (λ + μ x) e^(α x)','y = λ cos βx + μ sin βx'],
        ['Δ = 0 avec racine double r : forme des solutions ?','y = (λ + μ x) e^(r x)','y = λ e^(r x)','y = λ e^(r x) + μ e^(−r x)','y = λ cos rx + μ sin rx'],
        ['Structure de la solution générale avec second membre ?','Solution générale de l’homogène + une solution particulière','Une solution particulière seulement','Le produit des deux','La solution homogène seule']]},
    {t:'Algèbre linéaire : dimension et rang (PCSI)', s:'Maths', c:'Espace vectoriel : ensemble stable par combinaisons linéaires. Sous-espace : contient 0, stable par addition et par multiplication par un scalaire.\nFamille libre : aucune combinaison linéaire non triviale n’est nulle ; génératrice : elle engendre l’espace ; base : libre et génératrice. La dimension est le nombre de vecteurs d’une base.\nThéorème du rang : pour u linéaire sur E de dimension finie, dim E = dim Ker u + rg u.\nMatrice carrée inversible ⇔ det ≠ 0 ⇔ rang = n. det(AB) = det A × det B ; det(tA) = det A.\nFormule de Grassmann : dim(F + G) = dim F + dim G − dim(F ∩ G).',
     q:[['Théorème du rang ?','dim E = dim Ker u + rg u','dim E = rg u − dim Ker u','dim E = dim Ker u × rg u','dim E = dim Im u − 1'],
        ['Qu’est-ce qu’une base ?','Une famille libre et génératrice','Une famille génératrice seulement','Une famille libre seulement','Une famille quelconque de n vecteurs'],
        ['Quand une matrice carrée est-elle inversible ?','Quand son déterminant est non nul','Quand son déterminant est nul','Quand sa trace est non nulle','Quand tous ses coefficients sont positifs'],
        ['Formule de Grassmann ?','dim(F + G) = dim F + dim G − dim(F ∩ G)','dim(F + G) = dim F + dim G + dim(F ∩ G)','dim(F + G) = dim F × dim G','dim(F + G) = dim F + dim G']]},
    {t:'Équations de Maxwell (PC)', s:'Physique', c:'Maxwell–Gauss : div E = ρ/ε0.\nMaxwell–Faraday : rot E = −∂B/∂t.\nMaxwell–Thomson (flux) : div B = 0.\nMaxwell–Ampère : rot B = μ0 j + μ0 ε0 ∂E/∂t.\nLe terme μ0 ε0 ∂E/∂t (courant de déplacement) assure la cohérence avec la conservation de la charge et permet la propagation des ondes. Dans le vide, c = 1/√(μ0 ε0).',
     q:[['Équation de Maxwell–Gauss ?','div E = ρ/ε0','div E = 0','rot E = ρ/ε0','div B = ρ/ε0'],
        ['Quelle équation traduit l’absence de monopôle magnétique ?','div B = 0','rot B = 0','div E = 0','rot E = 0'],
        ['Quel terme s’ajoute à μ0 j dans Maxwell–Ampère ?','μ0 ε0 ∂E/∂t','−∂B/∂t','ε0 ∂B/∂t','μ0 ρ'],
        ['Équation de Maxwell–Faraday ?','rot E = −∂B/∂t','rot E = ∂B/∂t','rot B = −∂E/∂t','div E = −∂B/∂t']]},

    {"t":"Fiche 1 — Linking Words / Useful Expressions","s":"Anglais","c":"Photo de la fiche 1 et vocabulaire complet. Les questions portent sur toutes les entrées français → anglais de cette fiche.","image":"images/fiche-1.jpg","q":[["Traduction anglaise de : premièrement / tout d’abord","first (of all) / firstly / to start with / to begin with","secondly","then / later","moreover / furthermore / what's more / besides / in addition"],["Traduction anglaise de : deuxièmement","secondly","then / later","moreover / furthermore / what's more / besides / in addition","lastly / finally / eventually / ultimately / last but not least"],["Traduction anglaise de : ensuite","then / later","moreover / furthermore / what's more / besides / in addition","lastly / finally / eventually / ultimately / last but not least","to conclude / in conclusion / in short / all in all"],["Traduction anglaise de : de plus / en outre","moreover / furthermore / what's more / besides / in addition","lastly / finally / eventually / ultimately / last but not least","to conclude / in conclusion / in short / all in all","In fact / actually / indeed / as a matter of fact"],["Traduction anglaise de : enfin / pour finir","lastly / finally / eventually / ultimately / last but not least","to conclude / in conclusion / in short / all in all","In fact / actually / indeed / as a matter of fact","mostly / most importantly / above all"],["Traduction anglaise de : en conclusion","to conclude / in conclusion / in short / all in all","In fact / actually / indeed / as a matter of fact","mostly / most importantly / above all","however / nevertheless / (and) yet / on the other hand…"],["Traduction anglaise de : en fait / en effet","In fact / actually / indeed / as a matter of fact","mostly / most importantly / above all","however / nevertheless / (and) yet / on the other hand…","although / though / even if"],["Traduction anglaise de : surtout","mostly / most importantly / above all","however / nevertheless / (and) yet   var dbCards = [], dbCourses = [];
  function mergeData(){
    var bc = [], bq = [];
    LIBRARY.forEach(function(L, i){
      bc.push(normalizeCourseTheme({ id:'b' + i, title:L.t, subject:L.s, content:L.c, image:L.image || '', createdAt:0, author:'', builtin:true }));
      L.q.forEach(function(x, j){ bq.push({ id:'b' + i + '_' + j, subject:L.s, q:x[0], a:x[1], wrong:x.slice(2), courseId:'b' + i, createdAt:0, author:'', builtin:true }); });
    });
    courses = bc.concat(dbCourses.map(normalizeCourseTheme)); cards = bq.concat(dbCards);
  }
  function renderCourseDetail(box, c){
    var back = el('button','chip', themeView ? '← Retour au thème' : '← Tous les cours');
    back.onclick = function(){ courseView = null; qFormOpen = false; exp = null; render(); };
    box.appendChild(back);
    var h = el('h2','', c.title); h.style.marginBottom = '2px'; box.appendChild(h);
    box.appendChild(el('div','pill', c.subject+' · '+(c.theme||defaultTheme(c.subject,c.title,c.content))));
    if(c.image){ var heroImg=el('img'); heroImg.src=c.image; heroImg.alt='Photo du cours : '+c.title; heroImg.style.cssText='display:block;width:100%;max-height:360px;object-fit:contain;border-radius:12px;margin:12px 0;background:var(--panel2);'; box.appendChild(heroImg); }
    var cp = el('div','panel', c.content); cp.style.whiteSpace = 'pre-wrap'; cp.style.wordBreak = 'break-word'; box.appendChild(cp);

    var qs = cards.filter(function(x){ return x.courseId === c.id; });

    var row = el('div','row');
    var ab = el('button','btn', qFormOpen ? 'Fermer' : '➕ Question');
    ab.onclick = function(){ if(!qFormOpen) resetQDraft(c.id); qFormOpen = !qFormOpen; render(); };
    row.appendChild(ab); box.appendChild(row);

    if(qFormOpen){ var fw = el('div'); fw.style.marginTop = '12px'; box.appendChild(fw); renderQuestionForm(fw); }

    box.appendChild(el('h2','','Questions de ce cours (' + qs.length + ')'));
    if(!qs.length) box.appendChild(el('div','empty','Pas encore de question. Ajoute tes questions à la main.'));
    qs.slice().sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); }).forEach(function(x){ box.appendChild(questionItem(x, false)); });

    var ex = el('button','btn','🔗 Partager ce cours (lien + code)'); ex.style.width = '100%'; ex.style.marginTop = '14px';
    ex.onclick = function(){ exp = (exp && exp.course === c.id) ? null : { course:c.id, code:encodeCourse(c), link:makeCourseShareLink(encodeCourse(c)) }; render(); };
    box.appendChild(ex);
    if(exp && exp.course === c.id){
      var ep = el('div','panel'); ep.style.marginTop = '10px';
      ep.appendChild(el('p','count','Le code fonctionne dans Cours → Importer. Le lien ouvre cette même application et préremplit le formulaire d’importation.')).style.textAlign = 'left';
      ep.appendChild(el('label','','Lien de partage'));
      var linkta=el('textarea'); linkta.readOnly=true; linkta.value=exp.link; linkta.style.minHeight='76px'; linkta.style.fontSize='12px'; linkta.onfocus=function(){linkta.select();}; ep.appendChild(linkta);
      var linkrow=el('div','row'); linkrow.style.marginTop='8px';
      var linkcopy=el('button','btn primary','📋 Copier le lien'); linkcopy.onclick=function(){copyText(exp.link,linkta);}; linkrow.appendChild(linkcopy);
      var linkshare=el('button','btn','📤 Envoyer le lien'); linkshare.onclick=function(){if(navigator.share)navigator.share({title:'Cours : '+c.title,text:'Voici le cours « '+c.title+' »',url:exp.link}).catch(function(){});else copyText(exp.link,linkta);}; linkrow.appendChild(linkshare); ep.appendChild(linkrow);

      var er = el('row'); er.style.marginTop = '8px';
      var cb2 = el('button','btn','📋 Copier le code'); cb2.onclick = function(){ copyText(exp.code, eta); }; er.appendChild(cb2);

      ep.appendChild(er);
      if(window.location.protocol==='file:') ep.appendChild(el('p','msg','Attention : le lien ne fonctionnera chez ton ami que si l’application est publiée sur une adresse web accessible. Le code, lui, fonctionne aussi hors ligne.'));

    }
    var r3 = el('div','row'); r3.style.marginTop = '14px';
    var qb = el('button','btn primary','⚔️ Quiz sur ce cours'); qb.disabled = !qs.length;

    var db2 = el('button','btn danger','🗑️ Supprimer ce cours');
    db2.onclick = function(){
      askConfirm('Supprimer le cours « ' + c.title + ' » ?', 'Supprimer').then(function(y){
        if(!y) return null;
        if(!qs.length) return { also:false };
        return askConfirm('Supprimer aussi les ' + qs.length + ' question' + (qs.length > 1 ? 's' : '') + ' de ce cours ?', 'Les supprimer', 'Les garder').then(function(a2){ return { also:a2 }; });

        } else {
          courses = courses.filter(function(x){ return x.id !== c.id; });
          if(r.also){ var ids = qs.map(function(x){ return x.id; }); cards = cards.filter(function(x){ return ids.indexOf(x.id) < 0; }); rebuildOrder(); }

      });
    };
    r3.appendChild(qb); box.appendChild(r3);

    return r || String(s).trim().toLowerCase();
  }

    var slow = Math.max(1, Math.min.apply(null, actors.map(function(a){ return a.speed; })));
    actors.sort(function(a, b){ return b.speed - a.speed || (a.id === 'h' ? -1 : (b.id === 'h' ? 1 : 0)); });
    var cyc = [];

      en:mons.map(function(m){ return { mon:m, hp:m.hp, max:m.hp, atk:m.atk, def:m.def, speed:m.speed, agi:m.agi }; }),
      log:[mons.length > 1 ? '⚔️ Combat double : ' + mons.map(function(m){ return m.name; }).join(' et ') + ' !' : (mons[0].boss ? '👑 ' + mons[0].name + ' se dresse devant toi !' : mons[0].name + ' apparaît !')]

  function loadLeaderboard(){

    supabase.from('leaderboard_public').select('user_id,username,coins,xp,campaign_stage,updated_at').then(function(r){
      leaderboardLoading=false;leaderboardLoaded=true;
      if(r.error){leaderboardError=r.error.message||'Erreur de lecture de la table leaderboard_public.';leaderboardRows=[];}
      else {leaderboardError='';leaderboardRows=(r.data||[]).map(function(x){return {user_id:x.user_id,username:String(x.username||'Joueur').slice(0,20),coins:Math.max(0,Number(x.coins)||0),xp:Math.max(0,Number(x.xp)||0),camp:Math.max(0,Math.floor(Number(x.campaign_stage)||0))};});}

  /* ---------- système d'amis ---------- */
  function makeFriendCode(){
    var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', out='AMI-';
    for(var i=0;i<6;i++) out+=chars.charAt(Math.floor(Math.random()*chars.length));
    return out;
  }
  function ensureFriendProfile(user, attempt){
    if(!supabase||!user)return Promise.resolve();
    attempt=attempt||0;
    return supabase.from('friend_directory').select('friend_code').eq('user_id',user.id).maybeSingle().then(function(r){
      if(r.error)throw r.error;
      if(r.data&&r.data.friend_code){friendCode=r.data.friend_code; if(tab==='friends')renderFriends(); return;}
      var code=makeFriendCode();
      var username=String((me&&me.name)||(user.user_metadata&&user.user_metadata.username)||'Joueur').slice(0,20);
      return supabase.from('friend_directory').insert({user_id:user.id,username:username,friend_code:code}).then(function(w){
        if(w.error){if(attempt<5&&/duplicate|unique/i.test(w.error.message||''))return ensureFriendProfile(user,attempt+1);throw w.error;}
        friendCode=code; if(tab==='friends')renderFriends();
      });
    }).catch(function(e){friendsError=e&&e.message?e.message:'Impossible de créer le code ami.'; if(tab==='friends')renderFriends();});
  }

  function submitTradeOffer(){
    if(!tradeEditor||!tradeInventory||tradeBusy||!authUser)return;
    var t=tradeEditor;
    var give={simple:0,premium:0,parfaite:0},want={simple:0,premium:0,parfaite:0};
    Object.keys(give).forEach(function(k){give[k]=Math.max(0,Math.floor(+t.give[k]||0));want[k]=Math.max(0,Math.floor(+t.want[k]||0));});
    var gc=Math.max(0,Math.floor(+t.giveCoins||0)),wc=Math.max(0,Math.floor(+t.wantCoins||0));
    var giveQty=Object.keys(give).some(function(k){return give[k]>0;})||gc>0,wantQty=Object.keys(want).some(function(k){return want[k]>0;})||wc>0;
    if(!giveQty&&!wantQty){toast('Choisis au moins un objet ou une somme à donner ou demander.');return;}
    if(gc>me.coins){toast('Tu n’as pas assez de pièces.');return;}
    if(Object.keys(give).some(function(k){return give[k]>(me.potions&&me.potions[k]||0);})) {toast('Tu n’as pas assez de potions à donner.');return;}
    if(wc>tradeInventory.coins||Object.keys(want).some(function(k){return want[k]>((tradeInventory.potions||{})[k]||0);})) {toast('Ton ami ne possède pas assez de pièces ou de potions.');return;}
    tradeBusy=true;renderFriends();
    supabase.rpc('create_trade_offer',{p_addressee_id:t.friend.user_id,p_offer_potions:give,p_request_potions:want,p_offer_coins:gc,p_request_coins:wc}).then(function(r){if(r.error)throw r.error;toast('Proposition d’échange envoyée !');tradeEditor=null;tradeInventory=null;tradeRows=[];return loadFriends();}).catch(function(e){toast(e&&e.message?e.message:'Impossible d’envoyer cet échange. Vérifie le script SQL des échanges.');}).then(function(){tradeBusy=false;if(tab==='friends')renderFriends();});

  function makeDbAdapter(client){

              dataChannels.push(ch);
              return function(){alive=false;client.removeChannel(ch);};

          onSnapshot:function(callback, onError){

            refresh();
            profileChannel=client.channel('player-profile-'+id).on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'id=eq.'+id},refresh).subscribe();
            return function(){alive=false;if(profileChannel)client.removeChannel(profileChannel);profileChannel=null;};
